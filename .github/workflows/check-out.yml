name: Check-out

on:
  schedule:
    # 13:00 UTC = 18:30 IST, Monday–Friday — 30 min before the window so a
    # delayed GitHub run still starts in time. The script waits until a random
    # moment in 19:00–19:30 IST (config.json checkout_window) and punches then.
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only, do not call the API'
        type: boolean
        default: false
      no_sleep:
        description: 'Punch immediately (skip the random wait)'
        type: boolean
        default: false

concurrency:
  group: check-out
  cancel-in-progress: false

jobs:
  check-out:
    runs-on: ubuntu-latest
    timeout-minutes: 75       # 30 min lead + 30 min window + grace/overhead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests tzdata
      - name: Punch out
        env:
          HRORBIT_USERNAME: ${{ secrets.HRORBIT_USERNAME }}
          HRORBIT_PASSWORD: ${{ secrets.HRORBIT_PASSWORD }}
        run: >
          python scripts/punch.py --action out
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run)  && '--dry-run' || '' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.no_sleep) && '--no-sleep' || '' }}
