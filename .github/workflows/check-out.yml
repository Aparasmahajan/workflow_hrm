name: Check-out

on:
  # No `schedule:` — GitHub's cron ran 4–6 h late. cron-job.org calls the
  # workflow_dispatch API at 18:30 IST Mon–Fri instead; the script then waits
  # until a random moment in 19:00–19:30 IST (config.json checkout_window).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only, do not call the API'
        type: boolean
        default: false
      no_sleep:
        description: 'Punch immediately (skip the random wait)'
        type: boolean
        default: false

concurrency:
  group: check-out
  cancel-in-progress: false

jobs:
  check-out:
    runs-on: ubuntu-latest
    timeout-minutes: 75       # 30 min lead + 30 min window + grace/overhead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests tzdata
      - name: Punch out
        env:
          HRORBIT_USERNAME: ${{ secrets.HRORBIT_USERNAME }}
          HRORBIT_PASSWORD: ${{ secrets.HRORBIT_PASSWORD }}
        run: >
          python scripts/punch.py --action out
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run)  && '--dry-run' || '' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.no_sleep) && '--no-sleep' || '' }}
