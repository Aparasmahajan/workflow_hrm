name: Check-in

on:
  schedule:
    # 03:40 UTC = 09:10 IST, Monday–Friday — 30 min before the window so a
    # delayed GitHub run still starts in time. The script waits until a random
    # moment in 09:40–10:10 IST (config.json checkin_window) and punches then.
    - cron: '40 3 * * 1-5'
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      dry_run:
        description: 'Plan only, do not call the API'
        type: boolean
        default: false
      no_sleep:
        description: 'Punch immediately (skip the random wait)'
        type: boolean
        default: false
      login_only:
        description: 'Only test login, do NOT punch in'
        type: boolean
        default: false

# Stop two runs from overlapping.
concurrency:
  group: check-in
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 75       # 30 min lead + 30 min window + grace/overhead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests tzdata
      - name: Punch in
        env:
          HRORBIT_USERNAME: ${{ secrets.HRORBIT_USERNAME }}
          HRORBIT_PASSWORD: ${{ secrets.HRORBIT_PASSWORD }}
        run: >
          python scripts/punch.py --action in
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run)    && '--dry-run'    || '' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.no_sleep)   && '--no-sleep'   || '' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.login_only) && '--login-only' || '' }}
